<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>La Nave · tarjeta para compartir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --carbon:#2B2A26; --naranja:#F29100; --bronce:#B8862F; --hueso:#F4F1EA; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:var(--carbon);
    font-family:Inter,system-ui,sans-serif;color:var(--hueso)}
  .card{position:relative;width:1200px;height:630px;display:grid;
    grid-template-columns:1fr 520px;align-items:center;
    background:
      radial-gradient(40rem 30rem at 86% 50%, rgba(242,145,0,.16), transparent 62%),
      radial-gradient(50rem 34rem at 6% 0%, rgba(184,134,47,.10), transparent 60%),
      var(--carbon);}
  .txt{padding:0 0 0 84px}
  .eyebrow{display:flex;align-items:center;gap:14px;color:var(--naranja);
    font-size:19px;font-weight:700;letter-spacing:.34em;text-transform:uppercase}
  .eyebrow .rombo{font-size:15px;line-height:1}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:132px;line-height:.94;letter-spacing:.02em;margin:26px 0 30px}
  .lema{font-family:"Cormorant Garamond",Georgia,serif;font-size:49px;line-height:1.18;font-weight:500}
  .lema em{display:block;font-style:italic;font-weight:600;color:var(--naranja)}
  .pie{margin-top:46px;font-size:22px;line-height:1.5;white-space:nowrap;
    color:color-mix(in srgb,var(--hueso) 70%,transparent)}
  .pie .fila{display:flex;align-items:center;gap:16px}
  .pie .sep{width:7px;height:7px;border-radius:50%;background:var(--bronce);flex:none}
  .pie strong{color:var(--hueso);font-weight:600}
  .pie .url{margin-top:10px;color:color-mix(in srgb,var(--hueso) 82%,transparent);letter-spacing:.01em}
  .arte{position:relative;display:grid;place-items:center;height:630px}
  .aro{position:absolute;border:1px solid rgba(242,145,0,.22);border-radius:50%}
  .aro.a{width:460px;height:460px}
  .aro.b{width:330px;height:330px;border-color:rgba(242,145,0,.3)}
  .halo{position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(242,145,0,.34),transparent 64%);filter:blur(14px)}
  svg.corazon{position:relative;width:250px;height:235px;
    filter:drop-shadow(0 0 46px rgba(242,145,0,.55))}
</style></head>
<body>
  <div class="card">
    <div class="txt">
      <p class="eyebrow"><span class="rombo">&#9670;</span> Comunidad M&aacute;s Alto</p>
      <h1>LA NAVE</h1>
      <p class="lema">El coraz&oacute;n de La Nave<em>somos nosotros.</em></p>
      <div class="pie">
        <p class="fila"><strong>250 ladrillos</strong><span class="sep"></span>la levantamos entre todos</p>
        <p class="url">lanave.comunidadmasalto.org</p>
      </div>
    </div>
    <div class="arte">
      <span class="aro a"></span><span class="aro b"></span><span class="halo"></span>
      <svg class="corazon" viewBox="0 0 32 30" aria-hidden="true">
        <defs><radialGradient id="g" cx="50%" cy="38%" r="68%">
          <stop offset="0" stop-color="#FFCF6A"/><stop offset=".5" stop-color="#F29100"/>
          <stop offset="1" stop-color="#B8862F"/></radialGradient></defs>
        <path d="M16 28.6 C16 28.6 2.2 20.2 2.2 10.4 C2.2 5.7 5.7 3 9.1 3 C12 3 14.6 4.9 16 7.6 C17.4 4.9 20 3 22.9 3 C26.3 3 29.8 5.7 29.8 10.4 C29.8 20.2 16 28.6 16 28.6 Z" fill="url(#g)"/>
      </svg>
    </div>
  </div>
</body></html>
